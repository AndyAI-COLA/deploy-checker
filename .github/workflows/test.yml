name: CI Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run checker (full)
        run: python checker.py
        continue-on-error: false

      - name: Run checker (--check-only python)
        run: python checker.py -c python

      - name: Run checker (--check-only network disk)
        run: python checker.py -c network disk

      - name: Run checker (custom output)
        run: python checker.py -o test_output
        continue-on-error: false

      - name: Verify output files exist
        run: |
          python -c "import os; assert os.path.exists('test_output.log'), 'log file missing'"
          python -c "import os; assert os.path.exists('test_output.json'), 'json file missing'"
        shell: bash

      - name: Verify JSON structure
        run: |
          python -c "
          import json
          with open('test_output.json') as f:
              data = json.load(f)
          assert 'summary' in data
          assert 'results' in data
          assert isinstance(data['results'], list)
          assert len(data['results']) > 0
          print('JSON validation passed!')
          "
        shell: bash

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test_output.log
            test_output.json
          retention-days: 7
